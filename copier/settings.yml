---
_min_copier_version: "9"
_subdirectory: template
_envops:
  undefined: jinja2.StrictUndefined
_jinja_extensions:
  - copier_templates_extensions.TemplateExtensionLoader
  - copier/extensions/context.py:ContextUpdater
_tasks:
  - '{% if init_git %}git init{% else %}true{% endif %}'
  - '{% if init_git %}git remote add origin git@github.com:{{ vcs_github_path }}.git{% else %}true{% endif %}'
